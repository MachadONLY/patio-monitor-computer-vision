name: Academic Computer Vision - final deliverable integrity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/academic-cv-rubric.yml
      - gs/audit_cv_rubric.py
permissions:
  contents: read
jobs:
  deliverables:
    name: Validate actual PDF, video, training metrics and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF verifier and video codec tools
        run: |
          python -m pip install pypdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Inspect published PDF and media against the model artifact
        run: python gs/audit_cv_rubric.py
