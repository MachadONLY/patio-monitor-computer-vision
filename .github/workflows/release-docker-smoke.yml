name: Release smoke — complete Docker application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - deploy/start-public.sh
      - .github/workflows/release-docker-smoke.yml
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment Docker image with Qwen and frontend
        run: docker build --pull -t patio-monitor-release:test .
      - name: Start exact deployment image
        run: |
          docker run -d --name patio-release --memory 3g -p 127.0.0.1:18765:8000 \
            -e PORT=8000 -e PATIO_LIVE_PROVIDER=rio_brt \
            patio-monitor-release:test
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs patio-release
          exit 1
      - name: Verify real HTML, API, media, GPS source and local inference
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url="http://127.0.0.1:18765"
          def get(path):
              with urlopen(url+path, timeout=20) as res:
                  assert res.status==200,(path,res.status)
                  return res.read()
          html=get("/").decode("utf-8")
          assert "Pátio Monitor" in html,html[:300]
          data=json.loads(get("/api/gs/vision"))
          assert data["events"] and data["video"]["url"].endswith("annotated.mp4")
          recording=get("/api/gs/vision/media/annotated.mp4")
          assert recording[4:8]==b"ftyp" and len(recording)>100_000
          public=json.loads(get("/api/vehicles/snapshot?mode=LIVE"))
          assert public["source"]=="rio_mobi_gtfs_rt" and public["mode"]=="LIVE",public
          question={
            "question":"Que evidências devo verificar e qual é o próximo passo para revisar esta ocorrência?",
            "context":{"tripId":"PM-0615","status":"divergent","reason":"vehicle_swap","evidenceMode":"DEMO"},
          }
          req=Request(url+"/api/gs/explain",data=json.dumps(question).encode(),
              headers={"Content-Type":"application/json"},method="POST")
          with urlopen(req,timeout=75) as res:
              ans=json.load(res)
          assert not ans["refused"] and any(c["id"]=="p02" for c in ans["citations"]),ans
          print("Docker smoke accepted: HTML, actual video, live GPS source and Qwen p02")
          PY
      - name: Inspect container and logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs patio-release || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f patio-release || true
